title: Finding Milky Way halo substructure
author: Vasily Belokurov
copyright: "2026"
only_build_toc_files: true
exclude_patterns: [_build, .pytest_cache, "**/.pytest_cache", README.md, AGENTS.md, STRUCTURE.md, prototypes, data]

execute:
  execute_notebooks: 'off'     # notebooks are executed (and checked) by pytest --nbmake --overwrite in CI
  timeout: 1200

repository:
  url: https://github.com/vasilybelokurov/halo-substructure-tutorial
  branch: main

launch_buttons:
  colab_url: https://colab.research.google.com
  notebook_interface: classic

html:
  use_repository_button: true
  use_issues_button: true

sphinx:
  config:
    html_show_copyright: false
    myst_links_external_new_tab: true
