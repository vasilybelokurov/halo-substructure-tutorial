# Tests every notebook in a fresh kernel, builds the Jupyter Book (executing all notebooks),
# and deploys it to GitHub Pages on pushes to main.
name: Test and build book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt "jupyter-book==1.0.4.post1" pytest nbmake
      - name: Cache the data files (GitHub release data-v0.1)
        uses: actions/cache@v4
        with:
          path: notebooks/data
          key: data-v0.1
      - name: Tests and notebooks
        run: pytest -q tests/ --nbmake notebooks/ --nbmake-timeout=1200
      - name: Build book
        run: jupyter-book build . -W -n --keep-going
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
